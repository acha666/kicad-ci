name: KiCad PCB CI (Reusable)

on:
  workflow_call:
    inputs:
      project_name:
        description: Root KiCad project name, without extension.
        required: true
        type: string
      project_directory:
        description: Directory containing the KiCad project files, relative to the repository root.
        required: false
        default: "."
        type: string
      board_file:
        description: Board filename or relative path from project_directory. Defaults to <project_name>.kicad_pcb.
        required: false
        default: ""
        type: string
      schematic_file:
        description: Schematic filename or relative path from project_directory. Defaults to <project_name>.kicad_sch.
        required: false
        default: ""
        type: string
      kicad_image:
        description: KiCad Docker image used for DRC and exports.
        required: false
        default: "kicad/kicad:10.0-full"
        type: string
      runner:
        description: GitHub-hosted or self-hosted runner label.
        required: false
        default: "ubuntu-latest"
        type: string
      timezone:
        description: Timezone configured inside the KiCad container.
        required: false
        default: "Etc/UTC"
        type: string
      variant:
        description: Optional KiCad variant name for exports that support variants.
        required: false
        default: ""
        type: string
      define_vars:
        description: Extra KiCad text variables, one KEY=VALUE pair per line. BRANCH, SHORT_SHA, LONG_SHA, and IS_CI are added automatically.
        required: false
        default: ""
        type: string
      bom_format_preset:
        description: KiCad BOM format preset.
        required: false
        default: "CSV"
        type: string
      bom_fields:
        description: Comma-separated BOM fields.
        required: false
        default: "Reference,Value,Footprint,QUANTITY,DNP"
        type: string
      bom_labels:
        description: Comma-separated BOM column labels.
        required: false
        default: "Refs,Value,Footprint,Qty,DNP"
        type: string
      bom_group_by:
        description: Comma-separated BOM grouping fields.
        required: false
        default: "Reference,Value,Footprint,DNP"
        type: string
      artifact_retention_days:
        description: Artifact retention period in days.
        required: false
        default: 30
        type: number
      fail_on_drc_error:
        description: Fail the workflow when DRC errors are found. Export and release jobs are skipped either way.
        required: false
        default: true
        type: boolean
      release_enabled:
        description: Publish a GitHub Release after a successful export.
        required: false
        default: true
        type: boolean
      release_prerelease:
        description: Mark the generated release as a pre-release.
        required: false
        default: true
        type: boolean
      release_draft:
        description: Create the generated release as a draft.
        required: false
        default: false
        type: boolean
      release_tag_prefix:
        description: Prefix for auto-generated CI release tags.
        required: false
        default: "ci-build-"
        type: string
      release_tag_width:
        description: Zero-padded numeric width for generated release tags.
        required: false
        default: 2
        type: number
      release_name_prefix:
        description: Prefix for the generated release name.
        required: false
        default: "CI Build"
        type: string
      release_asset_prefix:
        description: Optional filename prefix for release assets. Defaults to project_name.
        required: false
        default: ""
        type: string
      render_width:
        description: Width in pixels for high-quality PCB render previews.
        required: false
        default: 3840
        type: number
      render_height:
        description: Height in pixels for high-quality PCB render previews.
        required: false
        default: 2160
        type: number
    outputs:
      short_sha:
        description: Seven-character commit SHA used in artifact and release asset names.
        value: ${{ jobs.drc-check.outputs.short_sha }}
      release_tag:
        description: Generated release tag. Empty when release_enabled is false.
        value: ${{ jobs.publish-release.outputs.release_tag }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  drc-check:
    name: KiCad DRC
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.kicad_image }}
      options: --user root
    outputs:
      proceed: ${{ steps.drc-gate.outputs.proceed }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      PROJECT_DIR: ${{ inputs.project_directory }}
      BOARD_FILE_INPUT: ${{ inputs.board_file }}
      SCHEMATIC_FILE_INPUT: ${{ inputs.schematic_file }}
      TIMEZONE: ${{ inputs.timezone }}
      KICAD_CONFIG_VERSION: "10.0"
      KICAD_VARIANT: ${{ inputs.variant }}
      EXTRA_DEFINE_VARS: ${{ inputs.define_vars }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install DRC tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates jq tzdata

      - name: Configure timezone
        run: |
          set -euo pipefail

          if [[ -n "$TIMEZONE" && -f "/usr/share/zoneinfo/$TIMEZONE" ]]; then
            ln -snf "/usr/share/zoneinfo/$TIMEZONE" /etc/localtime
            echo "$TIMEZONE" > /etc/timezone
          else
            echo "::warning::Timezone '$TIMEZONE' was not found. Keeping the container default timezone."
          fi

      - name: Configure KiCad global library tables
        run: |
          set -euo pipefail

          export KICAD_CONFIG_HOME="$HOME/.config/kicad"
          kicad_config_dir="$KICAD_CONFIG_HOME/$KICAD_CONFIG_VERSION"
          mkdir -p "$kicad_config_dir"

          echo "KICAD_CONFIG_HOME=$KICAD_CONFIG_HOME" >> "$GITHUB_ENV"

          find_template() {
            local filename="$1"
            local candidates=(
              "${KICAD_STOCK_DATA_HOME:-}/template/$filename"
              "/usr/share/kicad/template/$filename"
              "/usr/local/share/kicad/template/$filename"
            )

            local candidate
            for candidate in "${candidates[@]}"; do
              if [[ -n "$candidate" && -f "$candidate" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done

            find /usr/share /usr/local/share \
              -path "*/template/$filename" \
              -type f \
              -print \
              -quit 2>/dev/null
          }

          fp_template="$(find_template fp-lib-table)"
          sym_template="$(find_template sym-lib-table)"

          if [[ -z "$fp_template" || ! -f "$fp_template" ]]; then
            echo "::error::Could not find KiCad default fp-lib-table template."
            exit 1
          fi

          if [[ -z "$sym_template" || ! -f "$sym_template" ]]; then
            echo "::error::Could not find KiCad default sym-lib-table template."
            exit 1
          fi

          cp "$fp_template" "$kicad_config_dir/fp-lib-table"
          cp "$sym_template" "$kicad_config_dir/sym-lib-table"

          echo "::notice::Copied default global fp-lib-table to $kicad_config_dir/fp-lib-table"
          echo "::notice::Copied default global sym-lib-table to $kicad_config_dir/sym-lib-table"

      - name: Resolve KiCad project files
        id: paths
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          board_file="${BOARD_FILE_INPUT:-${PROJECT_NAME}.kicad_pcb}"
          schematic_file="${SCHEMATIC_FILE_INPUT:-${PROJECT_NAME}.kicad_sch}"

          if [[ ! -f "$board_file" ]]; then
            echo "::error::Board file not found: $PROJECT_DIR/$board_file"
            exit 1
          fi

          if [[ ! -f "$schematic_file" ]]; then
            echo "::error::Schematic file not found: $PROJECT_DIR/$schematic_file"
            exit 1
          fi

          echo "board_file=$board_file" >> "$GITHUB_OUTPUT"
          echo "schematic_file=$schematic_file" >> "$GITHUB_OUTPUT"

      - name: Derive commit SHAs
        id: sha
        run: |
          set -euo pipefail
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "long_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Create KiCad CI helper script
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/kicad-ci-common.sh" <<'EOF'
          set -euo pipefail

          enter_project_dir() {
            cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          }

          init_kicad_cli_args() {
            define_args=(
              -D "BRANCH=${GITHUB_REF_NAME}"
              -D "SHORT_SHA=${SHORT_SHA}"
              -D "LONG_SHA=${GITHUB_SHA}"
              -D "IS_CI=1"
            )

            while IFS= read -r define_var; do
              [[ -z "$define_var" || "$define_var" =~ ^[[:space:]]*# ]] && continue
              define_args+=(-D "$define_var")
            done <<< "${EXTRA_DEFINE_VARS:-}"

            variant_args=()
            if [[ -n "${KICAD_VARIANT:-}" ]]; then
              variant_args+=(--variant "$KICAD_VARIANT")
            fi
          }
          EOF

      - name: Generate DRC JSON reports
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          mkdir -p outputs/drc

          for severity in all warning exclusions; do
            echo "::group::Running KiCad DRC report: $severity"
            kicad-cli pcb drc \
              --format json \
              --schematic-parity \
              --severity-${severity} \
              -o "outputs/drc/${PROJECT_NAME}-drc-report-${severity}.json" \
              "${define_args[@]}" \
              "$BOARD_FILE"
            echo "::endgroup::"
          done

      - name: Run DRC gate
        id: drc-gate
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short_sha }}
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          set +e
          kicad-cli pcb drc \
            --format json \
            --schematic-parity \
            --severity-error \
            --exit-code-violations \
            -o "outputs/drc/${PROJECT_NAME}-drc-report-error.json" \
            "${define_args[@]}" \
            "$BOARD_FILE"
          drc_status=$?
          set -e

          if [[ ! -f "outputs/drc/${PROJECT_NAME}-drc-report-error.json" ]]; then
            echo "::error::KiCad DRC did not produce the expected error-level JSON report."
            exit 1
          fi

          if [[ "$drc_status" -eq 0 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::KiCad DRC passed with no error-level violations."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error::KiCad DRC found error-level violations. Export and release jobs will be skipped."
          fi

      - name: Emit KiCad DRC annotations
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          report="outputs/drc/${PROJECT_NAME}-drc-report-all.json"

          escape_annotation() {
            local value="$1"
            value="${value//'%'/'%25'}"
            value="${value//$'\r'/'%0D'}"
            value="${value//$'\n'/'%0A'}"
            printf '%s' "$value"
          }

          if [[ ! -f "$report" ]]; then
            echo "::warning::DRC report not found: $report"
            exit 0
          fi

          jq -c '(.violations // [])[]' "$report" | while IFS= read -r violation; do
            description=$(jq -r '.description // "No description"' <<< "$violation")
            severity=$(jq -r '.severity // "notice"' <<< "$violation")
            items=$(jq -r '[.items[]?.description] | join(", ")' <<< "$violation")

            command="notice"
            if [[ "$severity" == "warning" ]]; then
              command="warning"
            elif [[ "$severity" == "error" ]]; then
              command="error"
            fi

            message="${severity} - ${description}"
            if [[ -n "$items" ]]; then
              message="$message - $items"
            fi

            echo "::$command title=KiCad DRC::$(escape_annotation "$message")"
          done

      - name: Upload DRC JSON reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: drc-reports-${{ steps.sha.outputs.short_sha }}
          path: ${{ inputs.project_directory }}/outputs/drc
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore

      - name: Fail workflow on DRC errors
        if: ${{ steps.drc-gate.outputs.proceed == 'false' && inputs.fail_on_drc_error }}
        run: exit 1

  package-files:
    name: Export KiCad manufacturing files
    needs: drc-check
    if: ${{ needs.drc-check.outputs.proceed == 'true' }}
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.kicad_image }}
      options: --user root
    outputs:
      short_sha: ${{ needs.drc-check.outputs.short_sha }}
      top_image: ${{ steps.assemble-assets.outputs.top_image }}
      bottom_image: ${{ steps.assemble-assets.outputs.bottom_image }}
      schematic_image: ${{ steps.assemble-assets.outputs.schematic_image }}
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      PROJECT_DIR: ${{ inputs.project_directory }}
      BOARD_FILE_INPUT: ${{ inputs.board_file }}
      SCHEMATIC_FILE_INPUT: ${{ inputs.schematic_file }}
      TIMEZONE: ${{ inputs.timezone }}
      KICAD_CONFIG_VERSION: "10.0"
      KICAD_VARIANT: ${{ inputs.variant }}
      EXTRA_DEFINE_VARS: ${{ inputs.define_vars }}
      BOM_FORMAT_PRESET: ${{ inputs.bom_format_preset }}
      BOM_FIELDS: ${{ inputs.bom_fields }}
      BOM_LABELS: ${{ inputs.bom_labels }}
      BOM_GROUP_BY: ${{ inputs.bom_group_by }}
      RELEASE_ASSET_PREFIX_INPUT: ${{ inputs.release_asset_prefix }}
      RENDER_WIDTH: ${{ inputs.render_width }}
      RENDER_HEIGHT: ${{ inputs.render_height }}
      SHORT_SHA: ${{ needs.drc-check.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install export tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates imagemagick jq poppler-utils tzdata zip

      - name: Configure timezone
        run: |
          set -euo pipefail

          if [[ -n "$TIMEZONE" && -f "/usr/share/zoneinfo/$TIMEZONE" ]]; then
            ln -snf "/usr/share/zoneinfo/$TIMEZONE" /etc/localtime
            echo "$TIMEZONE" > /etc/timezone
          else
            echo "::warning::Timezone '$TIMEZONE' was not found. Keeping the container default timezone."
          fi

      - name: Configure KiCad global library tables
        run: |
          set -euo pipefail

          export KICAD_CONFIG_HOME="$HOME/.config/kicad"
          kicad_config_dir="$KICAD_CONFIG_HOME/$KICAD_CONFIG_VERSION"
          mkdir -p "$kicad_config_dir"

          echo "KICAD_CONFIG_HOME=$KICAD_CONFIG_HOME" >> "$GITHUB_ENV"

          find_template() {
            local filename="$1"
            local candidates=(
              "${KICAD_STOCK_DATA_HOME:-}/template/$filename"
              "/usr/share/kicad/template/$filename"
              "/usr/local/share/kicad/template/$filename"
            )

            local candidate
            for candidate in "${candidates[@]}"; do
              if [[ -n "$candidate" && -f "$candidate" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done

            find /usr/share /usr/local/share \
              -path "*/template/$filename" \
              -type f \
              -print \
              -quit 2>/dev/null
          }

          fp_template="$(find_template fp-lib-table)"
          sym_template="$(find_template sym-lib-table)"

          if [[ -z "$fp_template" || ! -f "$fp_template" ]]; then
            echo "::error::Could not find KiCad default fp-lib-table template."
            exit 1
          fi

          if [[ -z "$sym_template" || ! -f "$sym_template" ]]; then
            echo "::error::Could not find KiCad default sym-lib-table template."
            exit 1
          fi

          cp "$fp_template" "$kicad_config_dir/fp-lib-table"
          cp "$sym_template" "$kicad_config_dir/sym-lib-table"

          echo "::notice::Copied default global fp-lib-table to $kicad_config_dir/fp-lib-table"
          echo "::notice::Copied default global sym-lib-table to $kicad_config_dir/sym-lib-table"

      - name: Resolve KiCad project files
        id: paths
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          board_file="${BOARD_FILE_INPUT:-${PROJECT_NAME}.kicad_pcb}"
          schematic_file="${SCHEMATIC_FILE_INPUT:-${PROJECT_NAME}.kicad_sch}"

          if [[ ! -f "$board_file" ]]; then
            echo "::error::Board file not found: $PROJECT_DIR/$board_file"
            exit 1
          fi

          if [[ ! -f "$schematic_file" ]]; then
            echo "::error::Schematic file not found: $PROJECT_DIR/$schematic_file"
            exit 1
          fi

          echo "board_file=$board_file" >> "$GITHUB_OUTPUT"
          echo "schematic_file=$schematic_file" >> "$GITHUB_OUTPUT"

      - name: Create KiCad CI helper script
        run: |
          set -euo pipefail

          cat > "$GITHUB_WORKSPACE/kicad-ci-common.sh" <<'EOF'
          set -euo pipefail

          enter_project_dir() {
            cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
          }

          init_kicad_cli_args() {
            define_args=(
              -D "BRANCH=${GITHUB_REF_NAME}"
              -D "SHORT_SHA=${SHORT_SHA}"
              -D "LONG_SHA=${GITHUB_SHA}"
              -D "IS_CI=1"
            )

            while IFS= read -r define_var; do
              [[ -z "$define_var" || "$define_var" =~ ^[[:space:]]*# ]] && continue
              define_args+=(-D "$define_var")
            done <<< "${EXTRA_DEFINE_VARS:-}"

            variant_args=()
            if [[ -n "${KICAD_VARIANT:-}" ]]; then
              variant_args+=(--variant "$KICAD_VARIANT")
            fi
          }
          EOF

      - name: Prepare output directories
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          rm -rf outputs dist
          mkdir -p \
            outputs/gerber \
            outputs/pnp \
            outputs/step \
            outputs/vrml \
            outputs/bom \
            outputs/netlist/schematic \
            outputs/netlist/board \
            outputs/schematic \
            outputs/svg \
            outputs/png \
            outputs/render \
            outputs/stats \
            outputs/release \
            dist

      - name: Export Gerber files
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          kicad-cli pcb export gerbers \
            --subtract-soldermask \
            --board-plot-params \
            -o outputs/gerber/ \
            "${define_args[@]}" \
            "${variant_args[@]}" \
            "$BOARD_FILE"

      - name: Export drill files
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir

          kicad-cli pcb export drill \
            -o outputs/gerber/ \
            --format excellon \
            --drill-origin absolute \
            --excellon-units mm \
            --excellon-separate-th \
            --generate-map \
            --map-format gerberx2 \
            "$BOARD_FILE"

      - name: Export pick-and-place files
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          kicad-cli pcb export pos \
            -o "outputs/pnp/${PROJECT_NAME}-top-pos.csv" \
            --side front \
            --format csv \
            --units mm \
            --exclude-dnp \
            "${variant_args[@]}" \
            "$BOARD_FILE"

          kicad-cli pcb export pos \
            -o "outputs/pnp/${PROJECT_NAME}-bottom-pos.csv" \
            --side back \
            --format csv \
            --units mm \
            --exclude-dnp \
            "${variant_args[@]}" \
            "$BOARD_FILE"

      - name: Export 3D models
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          step_file="outputs/step/${PROJECT_NAME}.step"

          set +e
          kicad-cli pcb export step \
            -o "$step_file" \
            --no-dnp \
            --subst-models \
            --include-tracks \
            --include-zones \
            --include-silkscreen \
            --include-soldermask \
            "${define_args[@]}" \
            "${variant_args[@]}" \
            "$BOARD_FILE"
          step_status=$?
          set -e

          if [[ "$step_status" -ne 0 ]]; then
            if [[ -s "$step_file" ]]; then
              echo "::warning::KiCad STEP export returned exit code $step_status, but '$step_file' was created and is non-empty. Continuing."
            else
              echo "::error::KiCad STEP export failed with exit code $step_status and '$step_file' was not created."
              exit "$step_status"
            fi
          fi

          kicad-cli pcb export vrml \
            -o "outputs/vrml/${PROJECT_NAME}.wrl" \
            --units mm \
            --models-dir "${PROJECT_NAME}.wrl.modules" \
            --models-relative \
            "${define_args[@]}" \
            "${variant_args[@]}" \
            "$BOARD_FILE"

      - name: Export board SVG layers
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          for layer in F.Silkscreen F.Paste F.Mask F.Fab F.Cu; do
            kicad-cli pcb export svg \
              -o "outputs/svg/${PROJECT_NAME}-${layer}.svg" \
              --fit-page-to-board \
              --layers "$layer" \
              --mode-single \
              "${define_args[@]}" \
              "${variant_args[@]}" \
              "$BOARD_FILE"
          done

          for layer in B.Silkscreen B.Paste B.Mask B.Fab B.Cu; do
            kicad-cli pcb export svg \
              -o "outputs/svg/${PROJECT_NAME}-${layer}.svg" \
              --fit-page-to-board \
              --mirror \
              --layers "$layer" \
              --mode-single \
              "${define_args[@]}" \
              "${variant_args[@]}" \
              "$BOARD_FILE"
          done

          kicad-cli pcb export svg \
            -o "outputs/svg/${PROJECT_NAME}-Edge.Cuts.svg" \
            --fit-page-to-board \
            --layers Edge.Cuts \
            --mode-single \
            "${define_args[@]}" \
            "${variant_args[@]}" \
            "$BOARD_FILE"

          kicad-cli pcb export svg \
            -o "outputs/svg/${PROJECT_NAME}-Edge.Cuts-mirrored.svg" \
            --fit-page-to-board \
            --mirror \
            --layers Edge.Cuts \
            --mode-single \
            "${define_args[@]}" \
            "${variant_args[@]}" \
            "$BOARD_FILE"

      - name: Render high-resolution board previews
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          for side in top bottom; do
            kicad-cli pcb render \
              -o "outputs/render/${PROJECT_NAME}-${side}-render.png" \
              --side "$side" \
              --width "$RENDER_WIDTH" \
              --height "$RENDER_HEIGHT" \
              --background opaque \
              "${define_args[@]}" \
              "${variant_args[@]}" \
              "$BOARD_FILE"
          done

          test -s "outputs/render/${PROJECT_NAME}-top-render.png"
          test -s "outputs/render/${PROJECT_NAME}-bottom-render.png"

      - name: Export board statistics
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir

          kicad-cli pcb export stats \
            -o "outputs/stats/${PROJECT_NAME}-board-stats.json" \
            --format json \
            --units mm \
            "$BOARD_FILE"

          test -s "outputs/stats/${PROJECT_NAME}-board-stats.json"

      - name: Export netlists
        env:
          BOARD_FILE: ${{ steps.paths.outputs.board_file }}
          SCHEMATIC_FILE: ${{ steps.paths.outputs.schematic_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          netlist_formats=(
            kicadsexpr
            kicadxml
            cadstar
            orcadpcb2
            spice
            spicemodel
            pads
            allegro
          )

          for format in "${netlist_formats[@]}"; do
            kicad-cli sch export netlist \
              -o "outputs/netlist/schematic/${PROJECT_NAME}-${format}.net" \
              --format "$format" \
              "${variant_args[@]}" \
              "$SCHEMATIC_FILE"
          done

          kicad-cli pcb export ipcd356 \
            -o "outputs/netlist/board/${PROJECT_NAME}-ipcd356.d356" \
            "$BOARD_FILE"

      - name: Export schematic files
        env:
          SCHEMATIC_FILE: ${{ steps.paths.outputs.schematic_file }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/kicad-ci-common.sh"
          enter_project_dir
          init_kicad_cli_args

          kicad-cli sch export pdf \
            -o "outputs/schematic/${PROJECT_NAME}-schematic.pdf" \
            --no-background-color \
            "${define_args[@]}" \
            "${variant_args[@]}" \
            "$SCHEMATIC_FILE"

          kicad-cli sch export bom \
            -o "outputs/bom/${PROJECT_NAME}-bom.csv" \
            --format-preset "$BOM_FORMAT_PRESET" \
            --fields "$BOM_FIELDS" \
            --labels "$BOM_LABELS" \
            --group-by "$BOM_GROUP_BY" \
            "${variant_args[@]}" \
            "$SCHEMATIC_FILE"

      - name: Render schematic preview PNG
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          pdf="outputs/schematic/${PROJECT_NAME}-schematic.pdf"
          output_png="outputs/png/${PROJECT_NAME}-schematic.png"
          output_base="${output_png%.png}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          if [[ ! -s "$pdf" ]]; then
            echo "::error::Schematic PDF not found or empty: $pdf"
            exit 1
          fi

          page_count="$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"

          if [[ -z "$page_count" || ! "$page_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not determine schematic PDF page count: $pdf"
            exit 1
          fi

          if (( page_count < 1 )); then
            echo "::error::Schematic PDF has no pages: $pdf"
            exit 1
          fi

          echo "::notice::Schematic PDF page count: $page_count"

          if (( page_count == 1 )); then
            pdftocairo \
              -png \
              -singlefile \
              -r 384 \
              "$pdf" \
              "$output_base"
          else
            pdftocairo \
              -png \
              -r 384 \
              "$pdf" \
              "$tmp_dir/schematic-page"

            mapfile -d '' page_pngs < <(
              find "$tmp_dir" \
                -maxdepth 1 \
                -type f \
                -name 'schematic-page-*.png' \
                -print0 \
                | sort -z -V
            )

            if [[ "${#page_pngs[@]}" -ne "$page_count" ]]; then
              echo "::error::Expected $page_count rendered schematic page PNGs, got ${#page_pngs[@]}."
              echo "::error::Rendered files:"
              find "$tmp_dir" -maxdepth 1 -type f -print | sort -V
              exit 1
            fi

            if command -v magick >/dev/null 2>&1; then
              im_convert=(magick)
            else
              im_convert=(convert)
            fi

            "${im_convert[@]}" \
              "${page_pngs[@]}" \
              -background white \
              -alpha remove \
              -alpha off \
              -append \
              "$output_png"
          fi

          test -s "$output_png"

      - name: Create release metadata
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          stats_json="outputs/stats/${PROJECT_NAME}-board-stats.json"
          stats_md="outputs/release/board-stats.md"

          if [[ ! -s "$stats_json" ]]; then
            echo "::error::Board statistics JSON not found or empty: $stats_json"
            exit 1
          fi

          {
            echo "| Metric | Value |"
            echo "| --- | --- |"
            jq -r '
              def sum_values($obj; $keys):
                reduce $keys[] as $key (0; . + (($obj[$key] // 0) | tonumber? // 0));

              [
                ["Board size", ((.board.width // "n/a") + " x " + (.board.height // "n/a"))],
                ["Board area", (.board.area // "n/a")],
                ["Board thickness", (.board.board_thickness // "n/a")],
                ["Minimum track width", (.board.min_track_width // "n/a")],
                ["Minimum track clearance", (.board.min_track_clearance // "n/a")],
                ["Minimum drill diameter", (.board.min_drill_diameter // "n/a")],
                ["Components", ((.components.total.total // 0) | tostring)],
                ["SMD / THT components", (((.components.smd.total // 0) | tostring) + " / " + ((.components.tht.total // 0) | tostring))],
                ["Pads", (sum_values((.pads // {}); ["through_hole", "smd", "connector", "npth", "castellated", "press_fit"]) | tostring)],
                ["Vias", (sum_values((.vias // {}); ["through", "blind", "buried", "micro"]) | tostring)],
                ["Copper area (front / back)", ((.board.front_copper_area // "n/a") + " / " + (.board.back_copper_area // "n/a"))]
              ] | .[] | "| \(.[0]) | \(.[1]) |"
            ' "$stats_json"

            echo
            echo "<details>"
            echo "<summary>Drill hole breakdown</summary>"
            echo

            hole_count="$(jq '(.drill_holes // []) | length' "$stats_json")"
            if (( hole_count > 0 )); then
              echo "| Count | Size | Plated | Source | Layers |"
              echo "| ---: | --- | --- | --- | --- |"
              jq -r '
                (.drill_holes // [])[] |
                "| \(.count // 0) | \(.x_size // "n/a") x \(.y_size // "n/a") | \(if .plated == true then "Yes" elif .plated == false then "No" else "n/a" end) | \(.source // "n/a") | \(.start_layer // "n/a") to \(.stop_layer // "n/a") |"
              ' "$stats_json"
            else
              echo "No drill hole entries were reported."
            fi

            echo
            echo "</details>"
          } > "$stats_md"

          test -s "$stats_md"

      - name: Assemble release assets
        id: assemble-assets
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$PROJECT_DIR"

          asset_prefix="${RELEASE_ASSET_PREFIX_INPUT:-$PROJECT_NAME}"
          asset_prefix="$(printf '%s' "$asset_prefix" | tr -cs 'A-Za-z0-9._-' '-')"
          asset_prefix="${asset_prefix%-}"
          asset_prefix="${asset_prefix#-}"

          gerber_zip="${asset_prefix}-Gerber-Drill-${SHORT_SHA}.zip"
          bom_csv="${asset_prefix}-BOM-${SHORT_SHA}.csv"
          pnp_zip="${asset_prefix}-Pick-Place-${SHORT_SHA}.zip"
          step_zip="${asset_prefix}-STEP-${SHORT_SHA}.zip"
          vrml_zip="${asset_prefix}-VRML-${SHORT_SHA}.zip"
          netlist_zip="${asset_prefix}-Netlists-${SHORT_SHA}.zip"
          schematic_pdf="${asset_prefix}-Schematic-PDF-${SHORT_SHA}.pdf"
          svg_zip="${asset_prefix}-Board-SVG-${SHORT_SHA}.zip"
          top_image="${asset_prefix}-Top-Render-${SHORT_SHA}.png"
          bottom_image="${asset_prefix}-Bottom-Render-${SHORT_SHA}.png"
          schematic_image="${asset_prefix}-Schematic-Preview-${SHORT_SHA}.png"

          (cd outputs/gerber && zip -r "../../dist/$gerber_zip" .)
          (cd outputs/pnp && zip -r "../../dist/$pnp_zip" .)
          (cd outputs/step && zip -r "../../dist/$step_zip" .)
          (cd outputs/vrml && zip -r "../../dist/$vrml_zip" .)
          (cd outputs/netlist && zip -r "../../dist/$netlist_zip" .)
          (cd outputs/svg && zip -r "../../dist/$svg_zip" .)

          cp "outputs/schematic/${PROJECT_NAME}-schematic.pdf" "dist/$schematic_pdf"
          cp "outputs/bom/${PROJECT_NAME}-bom.csv" "dist/$bom_csv"
          cp "outputs/render/${PROJECT_NAME}-top-render.png" "dist/$top_image"
          cp "outputs/render/${PROJECT_NAME}-bottom-render.png" "dist/$bottom_image"
          cp "outputs/png/${PROJECT_NAME}-schematic.png" "dist/$schematic_image"

          echo "top_image=$top_image" >> "$GITHUB_OUTPUT"
          echo "bottom_image=$bottom_image" >> "$GITHUB_OUTPUT"
          echo "schematic_image=$schematic_image" >> "$GITHUB_OUTPUT"

      - name: Upload release asset bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ needs.drc-check.outputs.short_sha }}
          path: ${{ inputs.project_directory }}/dist
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata-${{ needs.drc-check.outputs.short_sha }}
          path: ${{ inputs.project_directory }}/outputs/release
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload raw exported files
        uses: actions/upload-artifact@v7
        with:
          name: raw-kicad-outputs-${{ needs.drc-check.outputs.short_sha }}
          path: ${{ inputs.project_directory }}/outputs
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: package-files
    if: ${{ inputs.release_enabled && needs.package-files.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.calculate-tag.outputs.next_tag }}
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      KICAD_IMAGE: ${{ inputs.kicad_image }}
      TOP_IMAGE: ${{ needs.package-files.outputs.top_image }}
      BOTTOM_IMAGE: ${{ needs.package-files.outputs.bottom_image }}
      SCHEMATIC_IMAGE: ${{ needs.package-files.outputs.schematic_image }}

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets-${{ needs.package-files.outputs.short_sha }}
          path: release-assets

      - name: Download release metadata
        uses: actions/download-artifact@v7
        with:
          name: release-metadata-${{ needs.package-files.outputs.short_sha }}
          path: release-metadata

      - name: Compute next CI release tag
        id: calculate-tag
        run: |
          set -euo pipefail

          git fetch --tags --force

          prefix="${{ inputs.release_tag_prefix }}"
          width="${{ inputs.release_tag_width }}"
          latest_number=0

          while IFS= read -r tag; do
            number="${tag#"$prefix"}"
            if [[ "$number" =~ ^[0-9]+$ ]] && (( 10#$number > latest_number )); then
              latest_number=$((10#$number))
            fi
          done < <(git tag -l "${prefix}*")

          next_number=$((latest_number + 1))
          printf -v next_tag "%s%0*d" "$prefix" "$width" "$next_number"

          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "next_number=$next_number" >> "$GITHUB_OUTPUT"
          echo "Next tag: $next_tag"

      - name: Compose release body
        run: |
          set -euo pipefail

          tag="${{ steps.calculate-tag.outputs.next_tag }}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          stats_file="release-metadata/board-stats.md"

          if [[ ! -s "$stats_file" ]]; then
            echo "::error::Release statistics metadata not found: $stats_file"
            exit 1
          fi

          asset_description() {
            case "$1" in
              *-Gerber-Drill-*) printf 'Gerber, Excellon drill, and drill map files' ;;
              *-BOM-*) printf 'Bill of materials CSV' ;;
              *-Pick-Place-*) printf 'Top and bottom pick-and-place CSV files' ;;
              *-STEP-*) printf 'STEP 3D model' ;;
              *-VRML-*) printf 'VRML 3D model and relative model assets' ;;
              *-Netlists-*) printf 'Schematic netlists plus board IPC-D-356 netlist' ;;
              *-Schematic-PDF-*) printf 'Schematic PDF' ;;
              *-Board-SVG-*) printf 'Board SVG layer exports' ;;
              *-Top-Render-*) printf 'High-resolution top board render' ;;
              *-Bottom-Render-*) printf 'High-resolution bottom board render' ;;
              *-Schematic-Preview-*) printf 'Schematic preview PNG' ;;
              *) printf 'Release asset' ;;
            esac
          }

          {
            echo "Automated KiCad CI build for **${PROJECT_NAME}**."
            echo
            echo "Review all generated manufacturing files before fabrication."
            echo
            echo "| Project | Commit | KiCad image |"
            echo "| --- | --- | --- |"
            echo "| ${PROJECT_NAME} | \`${GITHUB_SHA::7}\` | \`${KICAD_IMAGE}\` |"
            echo
            echo "## Board Renders"
            echo
            echo "![Top board render](${base_url}/${TOP_IMAGE})"
            echo
            echo "![Bottom board render](${base_url}/${BOTTOM_IMAGE})"
            echo
            echo "## Board Statistics"
            echo
            cat "$stats_file"
            echo
            echo "<details>"
            echo "<summary>Schematic preview</summary>"
            echo
            echo "![Schematic preview](${base_url}/${SCHEMATIC_IMAGE})"
            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>Release assets</summary>"
            echo
            echo "| Asset | Contents |"
            echo "| --- | --- |"

            while IFS= read -r asset_path; do
              asset="$(basename "$asset_path")"

              printf '| [`%s`](%s/%s) | %s |\n' \
                "$asset" \
                "$base_url" \
                "$asset" \
                "$(asset_description "$asset")"
            done < <(find release-assets -maxdepth 1 -type f | sort -V)

            echo
            echo "</details>"
            echo
            echo "<details>"
            echo "<summary>Build details</summary>"
            echo
            echo "- Release tag: \`${tag}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Full commit: \`${GITHUB_SHA}\`"
            echo "- KiCad image: \`${KICAD_IMAGE}\`"
            echo
            echo "</details>"
          } > release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: "${{ inputs.release_name_prefix }} #${{ steps.calculate-tag.outputs.next_number }}"
          tag_name: ${{ steps.calculate-tag.outputs.next_tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.release_draft }}
          prerelease: ${{ inputs.release_prerelease }}
          body_path: release-body.md
          files: release-assets/*
